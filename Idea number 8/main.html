<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In — Tufts University</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            tufts: { dark: '#002E6D', digital: '#3172AE', hover: '#255E94' }
          },
          keyframes: {
            'slide-right': {
              from: { opacity: '0', transform: 'translateX(24px)' },
              to:   { opacity: '1', transform: 'translateX(0)' }
            },
            'slide-left': {
              from: { opacity: '0', transform: 'translateX(-24px)' },
              to:   { opacity: '1', transform: 'translateX(0)' }
            },
            shake: {
              '0%,100%': { transform: 'translateX(0)' },
              '15%':     { transform: 'translateX(-5px)' },
              '30%':     { transform: 'translateX(5px)' },
              '45%':     { transform: 'translateX(-4px)' },
              '60%':     { transform: 'translateX(4px)' },
              '75%':     { transform: 'translateX(-2px)' },
              '90%':     { transform: 'translateX(2px)' }
            }
          },
          animation: {
            'slide-right': 'slide-right 0.3s cubic-bezier(0.16,1,0.3,1)',
            'slide-left':  'slide-left 0.3s cubic-bezier(0.16,1,0.3,1)',
            shake:         'shake 0.45s ease-out'
          }
        }
      }
    }
  </script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    body { font-family: 'Inter', sans-serif; }
    input:-webkit-autofill { -webkit-box-shadow: 0 0 0 40px #fff inset !important; }
  </style>
</head>
<body class="bg-slate-100 min-h-screen">
  <a href="../index.html" style="position:fixed;top:16px;left:16px;z-index:50;display:flex;align-items:center;gap:6px;padding:6px 14px 6px 10px;background:rgba(255,255,255,0.92);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-radius:9999px;font-size:12px;font-weight:600;color:#002E6D;text-decoration:none;box-shadow:0 1px 6px rgba(0,0,0,0.12);border:1px solid rgba(0,0,0,0.07);">
    <svg width="13" height="13" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/></svg>
    All designs
  </a>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useRef } = React;

    /* ── Reusable components ─────────────────────────────── */

    function ServiceIndicator() {
      return (
        <div className="flex items-center gap-3 p-3 rounded-xl bg-slate-50 border border-slate-200 mb-6">
          <div className="shrink-0 w-10 h-10 rounded-lg bg-white border border-slate-200 flex items-center justify-center overflow-hidden">
            {/* Swap for: <img src="service-logo.png" className="w-full h-full object-contain p-1.5" /> */}
            <span className="text-xs font-bold text-slate-300">APP</span>
          </div>
          <div className="min-w-0">
            <p className="text-xs text-slate-400 leading-none mb-1">Signing in to</p>
            <p className="text-sm font-semibold text-slate-700 truncate">Service Name</p>
          </div>
        </div>
      );
    }

    function StepBar({ step }) {
      return (
        <div className="flex items-center gap-2 mb-6">
          <div className={`h-0.5 flex-1 rounded-full transition-colors duration-300 ${step >= 1 ? 'bg-tufts-digital' : 'bg-slate-200'}`} />
          <div className={`h-0.5 flex-1 rounded-full transition-colors duration-300 ${step >= 2 ? 'bg-tufts-digital' : 'bg-slate-200'}`} />
        </div>
      );
    }

    /* forwardRef so parent can focus the <input> */
    const Field = React.forwardRef(function Field({ label, id, addon, ...rest }, ref) {
      return (
        <div>
          <label htmlFor={id} className="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1.5">
            {label}
          </label>
          <div className="relative">
            <input
              id={id} ref={ref}
              className={`w-full px-3.5 py-2.5 ${addon ? 'pr-10' : ''} rounded-lg border border-slate-300 bg-white text-slate-800 placeholder-slate-300 text-sm focus:outline-none focus:ring-2 focus:ring-tufts-digital focus:border-transparent transition`}
              {...rest}
            />
            {addon && (
              <div className="absolute right-3 top-1/2 -translate-y-1/2">{addon}</div>
            )}
          </div>
        </div>
      );
    });

    function Btn({ loading, children, ...props }) {
      return (
        <button
          className="w-full py-2.5 rounded-lg bg-tufts-dark text-white text-sm font-semibold hover:bg-tufts-hover transition-colors active:scale-[0.99] flex items-center justify-center gap-2 disabled:opacity-60 disabled:cursor-not-allowed"
          disabled={loading} {...props}
        >
          {loading ? (
            <>
              <svg className="w-4 h-4 animate-spin" fill="none" viewBox="0 0 24 24">
                <circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4" />
                <path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z" />
              </svg>
              Signing in…
            </>
          ) : children}
        </button>
      );
    }

    const EyeIcon = () => (
      <svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}>
        <path strokeLinecap="round" strokeLinejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
        <path strokeLinecap="round" strokeLinejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
      </svg>
    );

    const EyeOffIcon = () => (
      <svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}>
        <path strokeLinecap="round" strokeLinejoin="round" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21" />
      </svg>
    );

    /* ── Main App ─────────────────────────────────────────── */

    function App() {
      const [step,     setStep]     = useState(1);
      const [dir,      setDir]      = useState('fwd'); // 'fwd' | 'bwd'
      const [animKey,  setAnimKey]  = useState(0);     // changing key re-mounts → replays animation
      const [username, setUsername] = useState('');
      const [password, setPassword] = useState('');
      const [showPw,   setShowPw]   = useState(false);
      const [error,    setError]    = useState('');
      const [errKey,   setErrKey]   = useState(0);
      const [loading,  setLoading]  = useState(false);

      const unRef = useRef(null);
      const pwRef = useRef(null);

      function triggerErr(msg) {
        setError(msg);
        setErrKey(k => k + 1); // re-mounts the error div → replays shake
      }

      function advance() {
        if (!username.trim()) { triggerErr('Please enter your Tufts username.'); return; }
        setDir('fwd'); setAnimKey(k => k + 1); setStep(2); setError('');
        setTimeout(() => pwRef.current?.focus(), 40);
      }

      function back() {
        setDir('bwd'); setAnimKey(k => k + 1); setStep(1); setPassword(''); setError('');
        setTimeout(() => unRef.current?.focus(), 40);
      }

      function submit(e) {
        e.preventDefault();
        if (!password) { triggerErr('Please enter your password.'); return; }
        setError(''); setLoading(true);
      }

      const anim = dir === 'fwd' ? 'animate-slide-right' : 'animate-slide-left';

      return (
        <div className="min-h-screen flex flex-col items-center justify-center p-4">
          <div className="w-full max-w-sm">

            <div className="flex justify-center mb-8">
              <img src="../Tufts_univ_blue_small usage final.png" alt="Tufts University" className="h-9" />
            </div>

            <div className="bg-white rounded-2xl shadow-xl border border-slate-100 overflow-hidden">
              {/* Gradient progress line */}
              <div className="h-[3px] bg-slate-100">
                <div
                  className="h-full bg-gradient-to-r from-tufts-dark to-tufts-digital transition-all duration-500 ease-out"
                  style={{ width: step === 1 ? '50%' : '100%' }}
                />
              </div>

              <div className="p-7">
                <ServiceIndicator />
                <StepBar step={step} />

                {/* key change unmounts/remounts this div → CSS animation replays */}
                <div key={animKey} className={anim}>

                  {step === 1 ? (
                    <div>
                      <h1 className="text-xl font-bold text-slate-800 mb-1">Welcome</h1>
                      <p className="text-sm text-slate-400 mb-5">Sign in with your Tufts credentials.</p>

                      {error && (
                        <div key={errKey}
                          className="flex items-start gap-2.5 p-3 rounded-lg bg-red-50 border border-red-200 text-sm text-red-700 mb-4 animate-shake"
                          role="alert">
                          <svg className="w-4 h-4 mt-0.5 shrink-0 text-red-500" fill="currentColor" viewBox="0 0 20 20">
                            <path fillRule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z" clipRule="evenodd" />
                          </svg>
                          {error}
                        </div>
                      )}

                      <div className="space-y-4">
                        <Field
                          ref={unRef} id="username" label="Tufts Username"
                          type="text" placeholder="e.g. jsmith01"
                          value={username} autoFocus autoComplete="username"
                          onChange={e => { setUsername(e.target.value); setError(''); }}
                          onKeyDown={e => e.key === 'Enter' && advance()}
                        />
                        <Btn type="button" onClick={advance}>Continue →</Btn>
                      </div>
                    </div>

                  ) : (
                    <form onSubmit={submit}>
                      <div className="flex items-center gap-2 mb-4">
                        <button type="button" onClick={back}
                          className="text-slate-400 hover:text-tufts-dark transition-colors"
                          aria-label="Go back">
                          <svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2.5}>
                            <path strokeLinecap="round" strokeLinejoin="round" d="M15 19l-7-7 7-7" />
                          </svg>
                        </button>
                        <h1 className="text-xl font-bold text-slate-800">Enter password</h1>
                      </div>

                      {/* Username chip */}
                      <div className="flex items-center gap-3 p-2.5 rounded-xl bg-tufts-dark/5 border border-tufts-dark/10 mb-5">
                        <div className="shrink-0 w-8 h-8 rounded-full bg-tufts-dark flex items-center justify-center">
                          <span className="text-white text-xs font-bold">{username[0]?.toUpperCase()}</span>
                        </div>
                        <span className="text-sm font-medium text-slate-700 flex-1 truncate">{username}@tufts.edu</span>
                        <button type="button" onClick={back}
                          className="text-xs font-semibold text-tufts-digital hover:text-tufts-hover shrink-0 transition-colors">
                          Change
                        </button>
                      </div>

                      {error && (
                        <div key={errKey}
                          className="flex items-start gap-2.5 p-3 rounded-lg bg-red-50 border border-red-200 text-sm text-red-700 mb-4 animate-shake"
                          role="alert">
                          <svg className="w-4 h-4 mt-0.5 shrink-0 text-red-500" fill="currentColor" viewBox="0 0 20 20">
                            <path fillRule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z" clipRule="evenodd" />
                          </svg>
                          {error}
                        </div>
                      )}

                      <div className="space-y-4">
                        <Field
                          ref={pwRef} id="password" label="Password"
                          type={showPw ? 'text' : 'password'} placeholder="••••••••"
                          value={password} autoComplete="current-password"
                          onChange={e => { setPassword(e.target.value); setError(''); }}
                          addon={
                            <button type="button" onClick={() => setShowPw(s => !s)}
                              className="text-slate-400 hover:text-slate-600 transition-colors"
                              aria-label={showPw ? 'Hide password' : 'Show password'}>
                              {showPw ? <EyeOffIcon /> : <EyeIcon />}
                            </button>
                          }
                        />
                        <Btn loading={loading}>Sign In</Btn>
                      </div>
                    </form>
                  )}

                </div>
              </div>
            </div>

            <p className="mt-5 text-center text-sm text-slate-400">
              Need help?{' '}
              <a href="tel:+16176272000" className="text-tufts-digital hover:underline">617-627-2000</a>
              {' · '}
              <a href="https://it.tufts.edu" className="text-tufts-digital hover:underline">it.tufts.edu</a>
            </p>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
