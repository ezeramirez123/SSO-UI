<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In — Tufts University</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            tufts: { dark: '#002E6D', digital: '#3172AE', hover: '#255E94' }
          },
          keyframes: {
            shake: {
              '0%,100%': { transform: 'translateX(0)' },
              '15%': { transform: 'translateX(-5px)' },
              '30%': { transform: 'translateX(5px)' },
              '45%': { transform: 'translateX(-4px)' },
              '60%': { transform: 'translateX(4px)' },
              '75%': { transform: 'translateX(-2px)' },
              '90%': { transform: 'translateX(2px)' }
            }
          },
          animation: { shake: 'shake 0.45s ease-out' }
        }
      }
    }
  </script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    body { font-family: 'Inter', sans-serif; background: #070E1A; }
    input:-webkit-autofill { -webkit-box-shadow: 0 0 0 40px #fff inset !important; }
  </style>
</head>
<body class="min-h-screen">
  <a href="../index.html" style="position:fixed;top:16px;left:16px;z-index:50;display:flex;align-items:center;gap:6px;padding:6px 14px 6px 10px;background:rgba(255,255,255,0.07);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-radius:9999px;font-size:12px;font-weight:600;color:rgba(255,255,255,0.7);text-decoration:none;border:1px solid rgba(255,255,255,0.12);">
    <svg width="13" height="13" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/></svg>
    All designs
  </a>

  <div id="root"></div>

  <script type="text/babel">
    const { useState } = React;

    const EyeIcon = () => (
      <svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}>
        <path strokeLinecap="round" strokeLinejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
        <path strokeLinecap="round" strokeLinejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
      </svg>
    );

    const EyeOffIcon = () => (
      <svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}>
        <path strokeLinecap="round" strokeLinejoin="round" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21" />
      </svg>
    );

    function App() {
      const [username, setUsername] = useState('');
      const [password, setPassword] = useState('');
      const [showPw,   setShowPw]   = useState(false);
      const [error,    setError]    = useState('');
      const [errKey,   setErrKey]   = useState(0);
      const [loading,  setLoading]  = useState(false);

      function triggerErr(msg) { setError(msg); setErrKey(k => k + 1); }

      function handleSubmit(e) {
        e.preventDefault();
        if (!username.trim()) { triggerErr('Please enter your Tufts username.'); return; }
        if (!password)        { triggerErr('Please enter your password.'); return; }
        setError(''); setLoading(true);
      }

      return (
        <div className="min-h-screen flex items-center justify-center p-4" style={{ background: '#070E1A' }}>
          <div className="w-full max-w-sm">

            {/* Card */}
            <div className="bg-white rounded-2xl overflow-hidden shadow-[0_32px_80px_rgba(0,0,0,0.5)]">

              {/* Digital Blue top stripe */}
              <div className="h-1.5 bg-tufts-digital" />

              <div className="p-8">

                {/* Logo + heading inline */}
                <div className="flex items-center gap-3 mb-7">
                  <img
                    src="../Tufts_univ_blue_small usage final.png"
                    alt="Tufts University"
                    className="h-7 shrink-0"
                  />
                  <div className="w-px h-5 bg-slate-200 shrink-0" />
                  <span className="text-sm font-semibold text-slate-500 tracking-wide">Single Sign-On</span>
                </div>

                {/* Service indicator */}
                <div className="flex items-center gap-3 p-3 rounded-xl bg-slate-50 border border-slate-200 mb-6">
                  <div className="shrink-0 w-10 h-10 rounded-lg bg-white border border-slate-200 flex items-center justify-center overflow-hidden">
                    <span className="text-xs font-bold text-slate-300">APP</span>
                  </div>
                  <div className="min-w-0">
                    <p className="text-xs text-slate-400 leading-none mb-1">Signing in to</p>
                    <p className="text-sm font-semibold text-slate-700 truncate">Service Name</p>
                  </div>
                </div>

                <h1 className="text-xl font-bold text-slate-800 mb-1">Welcome back</h1>
                <p className="text-sm text-slate-400 mb-6">Enter your credentials to continue.</p>

                {error && (
                  <div key={errKey}
                    className="flex items-start gap-2.5 p-3 rounded-lg bg-red-50 border border-red-200 text-sm text-red-700 mb-5 animate-shake"
                    role="alert">
                    <svg className="w-4 h-4 mt-0.5 shrink-0 text-red-500" fill="currentColor" viewBox="0 0 20 20">
                      <path fillRule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z" clipRule="evenodd" />
                    </svg>
                    {error}
                  </div>
                )}

                <form onSubmit={handleSubmit} className="space-y-4">
                  <div>
                    <label htmlFor="username" className="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1.5">Tufts Username</label>
                    <input id="username" type="text" placeholder="e.g. jsmith01"
                      value={username} autoFocus autoComplete="username"
                      onChange={e => { setUsername(e.target.value); setError(''); }}
                      className="w-full px-3.5 py-2.5 rounded-lg border border-slate-300 bg-white text-slate-800 placeholder-slate-300 text-sm focus:outline-none focus:ring-2 focus:ring-tufts-digital focus:border-transparent transition"
                    />
                  </div>

                  <div>
                    <label htmlFor="password" className="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1.5">Password</label>
                    <div className="relative">
                      <input id="password" type={showPw ? 'text' : 'password'} placeholder="••••••••"
                        value={password} autoComplete="current-password"
                        onChange={e => { setPassword(e.target.value); setError(''); }}
                        className="w-full px-3.5 py-2.5 pr-10 rounded-lg border border-slate-300 bg-white text-slate-800 placeholder-slate-300 text-sm focus:outline-none focus:ring-2 focus:ring-tufts-digital focus:border-transparent transition"
                      />
                      <button type="button" onClick={() => setShowPw(s => !s)}
                        className="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 transition-colors"
                        aria-label={showPw ? 'Hide password' : 'Show password'}>
                        {showPw ? <EyeOffIcon /> : <EyeIcon />}
                      </button>
                    </div>
                  </div>

                  <button type="submit" disabled={loading}
                    className="w-full py-2.5 rounded-lg bg-tufts-dark text-white text-sm font-semibold hover:bg-tufts-hover transition-colors active:scale-[0.99] disabled:opacity-60 flex items-center justify-center gap-2">
                    {loading ? (
                      <>
                        <svg className="w-4 h-4 animate-spin" fill="none" viewBox="0 0 24 24">
                          <circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4" />
                          <path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z" />
                        </svg>
                        Signing in…
                      </>
                    ) : 'Sign In'}
                  </button>
                </form>

                {/* Help inside card */}
                <div className="mt-6 pt-5 border-t border-slate-100 text-center">
                  <p className="text-xs text-slate-400">
                    Need help?{' '}
                    <a href="tel:+16176272000" className="text-tufts-digital hover:underline">617-627-2000</a>
                    {' · '}
                    <a href="https://it.tufts.edu" className="text-tufts-digital hover:underline">it.tufts.edu</a>
                  </p>
                </div>

              </div>
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
