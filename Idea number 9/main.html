<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In — Tufts University</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            tufts: { dark: '#002E6D', digital: '#3172AE', hover: '#255E94' }
          },
          keyframes: {
            shake: {
              '0%,100%': { transform: 'translateX(0)' },
              '15%':     { transform: 'translateX(-5px)' },
              '30%':     { transform: 'translateX(5px)' },
              '45%':     { transform: 'translateX(-4px)' },
              '60%':     { transform: 'translateX(4px)' },
              '75%':     { transform: 'translateX(-2px)' },
              '90%':     { transform: 'translateX(2px)' }
            },
            'blob-a': {
              '0%,100%': { transform: 'translate(0,0) scale(1)' },
              '33%':     { transform: 'translate(50px,-40px) scale(1.07)' },
              '66%':     { transform: 'translate(-35px,30px) scale(0.94)' }
            },
            'blob-b': {
              '0%,100%': { transform: 'translate(0,0) scale(1)' },
              '33%':     { transform: 'translate(-40px,30px) scale(1.05)' },
              '66%':     { transform: 'translate(30px,-25px) scale(0.96)' }
            }
          },
          animation: {
            shake:   'shake 0.45s ease-out',
            'blob-a': 'blob-a 14s ease-in-out infinite',
            'blob-b': 'blob-b 18s ease-in-out infinite'
          }
        }
      }
    }
  </script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    body { font-family: 'Inter', sans-serif; background: #001233; }
    input:-webkit-autofill { -webkit-box-shadow: 0 0 0 40px rgba(255,255,255,0.95) inset !important; }
  </style>
</head>
<body class="min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState } = React;

    const EyeIcon = () => (
      <svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}>
        <path strokeLinecap="round" strokeLinejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
        <path strokeLinecap="round" strokeLinejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
      </svg>
    );

    const EyeOffIcon = () => (
      <svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}>
        <path strokeLinecap="round" strokeLinejoin="round" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21" />
      </svg>
    );

    function App() {
      const [username, setUsername] = useState('');
      const [password, setPassword] = useState('');
      const [showPw,   setShowPw]   = useState(false);
      const [error,    setError]    = useState('');
      const [errKey,   setErrKey]   = useState(0);
      const [loading,  setLoading]  = useState(false);

      function triggerErr(msg) {
        setError(msg);
        setErrKey(k => k + 1);
      }

      function handleSubmit(e) {
        e.preventDefault();
        if (!username.trim()) { triggerErr('Please enter your Tufts username.'); return; }
        if (!password)        { triggerErr('Please enter your password.'); return; }
        setError(''); setLoading(true);
      }

      /* Glass card style applied via inline style for cross-browser backdrop-filter */
      const glass = {
        background: 'rgba(255,255,255,0.07)',
        backdropFilter: 'blur(28px)',
        WebkitBackdropFilter: 'blur(28px)',
        border: '1px solid rgba(255,255,255,0.12)',
      };

      const glassLight = {
        background: 'rgba(255,255,255,0.08)',
        border: '1px solid rgba(255,255,255,0.1)',
      };

      const inputStyle = {
        background: 'rgba(255,255,255,0.95)',
        outline: 'none',
      };

      return (
        <div className="relative min-h-screen flex items-center justify-center p-4 overflow-hidden">

          {/* ── Animated background ───────────────────────── */}
          <div className="absolute inset-0 pointer-events-none">
            {/* Blobs */}
            <div className="absolute w-[700px] h-[700px] rounded-full bg-tufts-digital/25 blur-[160px] -top-72 -left-72 animate-blob-a" />
            <div className="absolute w-[600px] h-[600px] rounded-full bg-blue-600/15 blur-[140px] -bottom-48 -right-48 animate-blob-b" />
            <div className="absolute w-[350px] h-[350px] rounded-full bg-tufts-dark/60 blur-[80px] top-1/2 left-1/3 -translate-y-1/2" />
            {/* Decorative concentric rings */}
            <div className="absolute rounded-full top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2"
              style={{ width: '560px', height: '560px', border: '1px solid rgba(255,255,255,0.04)' }} />
            <div className="absolute rounded-full top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2"
              style={{ width: '840px', height: '840px', border: '1px solid rgba(255,255,255,0.025)' }} />
            <div className="absolute rounded-full top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2"
              style={{ width: '1120px', height: '1120px', border: '1px solid rgba(255,255,255,0.015)' }} />
          </div>

          {/* ── Card ──────────────────────────────────────── */}
          <div className="relative w-full max-w-sm">

            {/* Logo */}
            <div className="flex justify-center mb-7">
              <img
                src="../Tufts_univ_blue_small usage final.png"
                alt="Tufts University"
                className="h-9 filter brightness-0 invert opacity-90"
              />
            </div>

            <div className="rounded-3xl p-8 shadow-2xl" style={glass}>

              {/* Service indicator */}
              <div className="flex items-center gap-3 p-3 rounded-xl mb-7" style={glassLight}>
                <div className="shrink-0 w-10 h-10 rounded-lg flex items-center justify-center overflow-hidden" style={glassLight}>
                  {/* Swap for: <img src="service-logo.png" className="w-full h-full object-contain p-1.5" /> */}
                  <span className="text-xs font-bold" style={{ color: 'rgba(255,255,255,0.25)' }}>APP</span>
                </div>
                <div className="min-w-0">
                  <p className="text-xs leading-none mb-1" style={{ color: 'rgba(255,255,255,0.4)' }}>Signing in to</p>
                  <p className="text-sm font-semibold truncate" style={{ color: 'rgba(255,255,255,0.85)' }}>Service Name</p>
                </div>
              </div>

              <h1 className="text-2xl font-bold text-white mb-1">Sign in</h1>
              <p className="text-sm mb-6" style={{ color: 'rgba(255,255,255,0.45)' }}>
                Use your Tufts University credentials.
              </p>

              {/* Error banner */}
              {error && (
                <div key={errKey}
                  className="flex items-start gap-2.5 p-3 rounded-xl mb-5 text-sm animate-shake"
                  style={{ background: 'rgba(254,202,202,0.1)', border: '1px solid rgba(248,113,113,0.3)' }}
                  role="alert">
                  <svg className="w-4 h-4 mt-0.5 shrink-0" style={{ color: '#FCA5A5' }} fill="currentColor" viewBox="0 0 20 20">
                    <path fillRule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z" clipRule="evenodd" />
                  </svg>
                  <span style={{ color: '#FCA5A5' }}>{error}</span>
                </div>
              )}

              <form onSubmit={handleSubmit} className="space-y-4">

                {/* Username */}
                <div>
                  <label htmlFor="username"
                    className="block text-xs font-semibold uppercase tracking-wider mb-1.5"
                    style={{ color: 'rgba(255,255,255,0.5)' }}>
                    Tufts Username
                  </label>
                  <input
                    id="username" type="text" placeholder="e.g. jsmith01"
                    value={username} autoFocus autoComplete="username"
                    onChange={e => { setUsername(e.target.value); setError(''); }}
                    className="w-full px-4 py-2.5 rounded-xl text-sm text-slate-800 placeholder-slate-400 focus:ring-2 focus:ring-tufts-digital/60 transition"
                    style={inputStyle}
                  />
                </div>

                {/* Password */}
                <div>
                  <label htmlFor="password"
                    className="block text-xs font-semibold uppercase tracking-wider mb-1.5"
                    style={{ color: 'rgba(255,255,255,0.5)' }}>
                    Password
                  </label>
                  <div className="relative">
                    <input
                      id="password" type={showPw ? 'text' : 'password'} placeholder="••••••••"
                      value={password} autoComplete="current-password"
                      onChange={e => { setPassword(e.target.value); setError(''); }}
                      className="w-full px-4 py-2.5 pr-11 rounded-xl text-sm text-slate-800 placeholder-slate-400 focus:ring-2 focus:ring-tufts-digital/60 transition"
                      style={inputStyle}
                    />
                    <button type="button" onClick={() => setShowPw(s => !s)}
                      className="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 transition-colors"
                      aria-label={showPw ? 'Hide password' : 'Show password'}>
                      {showPw ? <EyeOffIcon /> : <EyeIcon />}
                    </button>
                  </div>
                </div>

                {/* Submit */}
                <button
                  type="submit" disabled={loading}
                  className="w-full py-2.5 rounded-xl font-semibold text-sm bg-white hover:bg-white/90 text-tufts-dark transition-all active:scale-[0.99] disabled:opacity-60 disabled:cursor-not-allowed flex items-center justify-center gap-2"
                >
                  {loading ? (
                    <>
                      <svg className="w-4 h-4 animate-spin" fill="none" viewBox="0 0 24 24">
                        <circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4" />
                        <path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z" />
                      </svg>
                      Signing in…
                    </>
                  ) : 'Sign In'}
                </button>

              </form>

              {/* Help — inside card footer */}
              <div className="mt-6 pt-5" style={{ borderTop: '1px solid rgba(255,255,255,0.1)' }}>
                <p className="text-center text-xs" style={{ color: 'rgba(255,255,255,0.38)' }}>
                  Need help?{' '}
                  <a href="tel:+16176272000" className="hover:underline transition-opacity"
                    style={{ color: 'rgba(255,255,255,0.65)' }}>617-627-2000</a>
                  {' · '}
                  <a href="https://it.tufts.edu" className="hover:underline transition-opacity"
                    style={{ color: 'rgba(255,255,255,0.65)' }}>it.tufts.edu</a>
                </p>
              </div>

            </div>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
